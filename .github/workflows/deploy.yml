name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: [self-hosted, production]
    env:
      IMAGE_NAME: pkbm-swastika
      PORT: 8005
      ENV_FILE: /var/www/pkbmswastika.sch.id/pkbm-swastika/.env

    steps:
      - name: Pull latest code
        env:
          HOME: /root
        run: git -C /var/www/pkbmswastika.sch.id/pkbm-swastika pull origin master

      - name: Build Docker image
        run: |
          cd /var/www/pkbmswastika.sch.id/pkbm-swastika
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.run_number }} .

      - name: Run database migration
        run: |
          cd /var/www/pkbmswastika.sch.id/pkbm-swastika
          # Sinkronkan skema database (tambah kolom baru, dll) sebelum container baru jalan.
          # Build target 'builder' karena di sana tersedia Prisma CLI + schema lengkap.
          docker build --target builder -t ${{ env.IMAGE_NAME }}-migrate:${{ github.run_number }} .
          # Aman & non-destruktif: prisma db push tanpa --accept-data-loss (hanya menambah perubahan).
          docker run --rm \
            --network host \
            --env-file ${{ env.ENV_FILE }} \
            ${{ env.IMAGE_NAME }}-migrate:${{ github.run_number }} \
            npx prisma db push --skip-generate
          docker rmi ${{ env.IMAGE_NAME }}-migrate:${{ github.run_number }} || true

      - name: Stop & remove old container
        run: |
          docker stop ${{ env.IMAGE_NAME }} || true
          docker rm ${{ env.IMAGE_NAME }} || true

      - name: Remove old images
        run: |
          docker images --filter=reference='${{ env.IMAGE_NAME }}' \
            --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
            | grep -v "${{ env.IMAGE_NAME }}:${{ github.run_number }}" \
            | awk '{print $1}' \
            | xargs -r docker rmi || true

      - name: Setup uploads directory
        run: |
          mkdir -p /var/www/pkbmswastika.sch.id/uploads/galeri
          mkdir -p /var/www/pkbmswastika.sch.id/uploads/berita
          mkdir -p /var/www/pkbmswastika.sch.id/uploads/general
          mkdir -p /var/www/pkbmswastika.sch.id/uploads/pendaftaran
          chown -R 1001:1001 /var/www/pkbmswastika.sch.id/uploads
          chmod -R 775 /var/www/pkbmswastika.sch.id/uploads

      - name: Deploy container
        run: |
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            --network host \
            --restart unless-stopped \
            -e PORT=${{ env.PORT }} \
            --env-file ${{ env.ENV_FILE }} \
            -v /var/www/pkbmswastika.sch.id/uploads:/app/public/uploads \
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}

          echo "✅ Deployed ${{ env.IMAGE_NAME }} on port ${{ env.PORT }}"
