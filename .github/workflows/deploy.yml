name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SSH_KEY" > deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new "$SSH_HOST" 'bash -s' <<'DEPLOY'
          set -euo pipefail

          APP=pkbm-swastika
          DIR=/var/www/pkbmswastika.sch.id/pkbm-swastika
          UPLOADS=/var/www/pkbmswastika.sch.id/uploads
          ENV_FILE=$DIR/.env

          cd "$DIR"
          git fetch origin master
          git reset --hard origin/master

          docker build -t $APP:latest .

          # Schema sync (non-destructive: no --accept-data-loss)
          docker build --target builder -t $APP-migrate .
          docker run --rm --network host --env-file "$ENV_FILE" \
            $APP-migrate npx prisma db push --skip-generate
          docker rmi $APP-migrate || true

          mkdir -p "$UPLOADS"/{galeri,berita,general,pendaftaran}
          chown -R 1001:1001 "$UPLOADS"
          chmod -R 775 "$UPLOADS"

          docker stop $APP || true
          docker rm $APP || true
          docker run -d \
            --name $APP \
            --network host \
            --restart unless-stopped \
            -e PORT=8005 \
            --env-file "$ENV_FILE" \
            -v "$UPLOADS":/app/public/uploads \
            $APP:latest

          docker image prune -f
          echo "✅ Deployed $APP on port 8005"
          DEPLOY
